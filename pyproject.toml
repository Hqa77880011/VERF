[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "verf"
version = "0.1.0"
description = "Versioned evolving fuzzy rules implementation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.11", "pandas>=2", "scikit-learn>=1.3", "matplotlib>=3.7"]
[project.scripts]
verf = "verf.cli:main"
[tool.setuptools.packages.find]
include = ["verf*"]
